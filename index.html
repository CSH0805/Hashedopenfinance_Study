<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이더리움 지갑 조회</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>이더리움 지갑 조회</h1>

  <p>현재 블록 번호: <span id="block-number">-</span></p>

  <div class="search">
    <input id="address-input" type="text" placeholder="0x로 시작하는 지갑 주소" autocomplete="off" spellcheck="false">
    <button id="search-button" type="button">조회</button>
  </div>

  <div id="result"></div>

  <script src="script.js"></script>
</body>
</html>
